<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 960" width="1400" height="960">
  <defs>
    <style>
      .bg { fill: #FFFFFF; }
      .header-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #111827; letter-spacing: -0.3px; }
      .header-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13.5px; font-weight: 400; fill: #4B5563; }
      .header-rule { stroke: #E5E7EB; stroke-width: 1.5; }

      .tier-container { fill: #FAFAFA; stroke: #9CA3AF; stroke-width: 1.2; rx: 8; }
      .tier-header-bar { fill: #FFFFFF; stroke: #E5E7EB; stroke-width: 1; rx: 8 8 0 0; }
      .tier-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #0E2A47; letter-spacing: 0.5px; text-transform: uppercase; }
      .tier-badge { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11px; font-weight: 600; fill: #6B7280; text-anchor: end; }

      .comp-card { fill: #FFFFFF; stroke: #D1D5DB; stroke-width: 1.2; rx: 6; }
      .comp-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #111827; }
      .comp-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 400; fill: #4B5563; }
      .comp-pill-bg { fill: #F1F5F9; stroke: #CBD5E1; stroke-width: 0.8; rx: 4; }
      .comp-pill-text { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 10.5px; font-weight: 600; fill: #0E2A47; }

      .arrow { fill: none; stroke: #111827; stroke-width: 1.4; marker-end: url(#arrow-head); }
      .arrow-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 600; fill: #111827; text-anchor: middle; }
      .label-bg { fill: #FFFFFF; }
    </style>

    <marker id="arrow-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#111827" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="960" class="bg" />

  <!-- Clean Academic Header -->
  <text x="50" y="42" class="header-title">System Architecture: Zero-Egress RAG Verification Gateway</text>
  <text x="50" y="66" class="header-subtitle">High-Level Multi-Tier Architecture: Ingestion, Proxy Gateway, Local NLI Inference, and Persistence</text>
  <line x1="50" y1="84" x2="1350" y2="84" class="header-rule" />

  <!-- ==================== TIER 1: CLIENT & INGESTION LAYER ==================== -->
  <rect x="50" y="105" width="1300" height="155" class="tier-container" />
  <rect x="50" y="105" width="1300" height="34" class="tier-header-bar" />
  <text x="75" y="127" class="tier-title">Tier 1: Client Application &amp; Ingestion Layer</text>
  <text x="1325" y="127" class="tier-badge">HTTP REST • OpenAI Protocol</text>

  <!-- Card 1.1 -->
  <g transform="translate(80, 150)">
    <rect width="570" height="95" class="comp-card" />
    <text x="20" y="30" class="comp-title">Conversational Chatbot Client</text>
    <text x="20" y="52" class="comp-sub">Minimal RAG Companion user interface with live telemetry drawer</text>
    <rect x="20" y="65" width="220" height="20" class="comp-pill-bg" />
    <text x="30" y="79" class="comp-pill-text">React 18 • TailwindCSS • Vite</text>
  </g>

  <!-- Card 1.2 -->
  <g transform="translate(750, 150)">
    <rect width="570" height="95" class="comp-card" />
    <text x="20" y="30" class="comp-title">Document Ingestion &amp; Parser</text>
    <text x="20" y="52" class="comp-sub">Local PDF text extraction, cleaning, and in-memory context indexing</text>
    <rect x="20" y="65" width="280" height="20" class="comp-pill-bg" />
    <text x="30" y="79" class="comp-pill-text">pdfplumber / fitz • Session Context</text>
  </g>


  <!-- ==================== TIER 2: GATEWAY & ROUTING LAYER ==================== -->
  <rect x="50" y="305" width="1300" height="155" class="tier-container" />
  <rect x="50" y="305" width="1300" height="34" class="tier-header-bar" />
  <text x="75" y="327" class="tier-title">Tier 2: Reverse Proxy Gateway &amp; Async Threadpool</text>
  <text x="1325" y="327" class="tier-badge">FastAPI • Starlette ASGI Engine</text>

  <!-- Card 2.1 -->
  <g transform="translate(80, 350)">
    <rect width="570" height="95" class="comp-card" />
    <text x="20" y="30" class="comp-title">Non-Blocking Async Dispatcher</text>
    <text x="20" y="52" class="comp-sub">Offloads heavy PyTorch verification to worker threads without event loop freezing</text>
    <rect x="20" y="65" width="290" height="20" class="comp-pill-bg" />
    <text x="30" y="79" class="comp-pill-text">starlette run_in_threadpool • Zero Freezing</text>
  </g>

  <!-- Card 2.2 -->
  <g transform="translate(750, 350)">
    <rect width="570" height="95" class="comp-card" />
    <text x="20" y="30" class="comp-title">Frontier Model Integration</text>
    <text x="20" y="52" class="comp-sub">Asynchronous proxy to upstream generative LLMs with automatic mitigation</text>
    <rect x="20" y="65" width="270" height="20" class="comp-pill-bg" />
    <text x="30" y="79" class="comp-pill-text">Google Gemini 3.5 Flash / Local vLLM</text>
  </g>


  <!-- ==================== TIER 3: CORE ML VERIFICATION ENGINE ==================== -->
  <rect x="50" y="505" width="1300" height="155" class="tier-container" />
  <rect x="50" y="505" width="1300" height="34" class="tier-header-bar" />
  <text x="75" y="527" class="tier-title">Tier 3: Core ML Verification &amp; NLI Engine</text>
  <text x="1325" y="527" class="tier-badge">Local CPU Inference • Zero Data Egress</text>

  <!-- Card 3.1 -->
  <g transform="translate(80, 550)">
    <rect width="380" height="95" class="comp-card" />
    <text x="20" y="30" class="comp-title">Claim Decomposer</text>
    <text x="20" y="52" class="comp-sub">Extracts atomic factual propositions from prose</text>
    <rect x="20" y="65" width="170" height="20" class="comp-pill-bg" />
    <text x="30" y="79" class="comp-pill-text">spaCy en_core_web_sm</text>
  </g>

  <!-- Card 3.2 -->
  <g transform="translate(510, 550)">
    <rect width="380" height="95" class="comp-card" />
    <text x="20" y="30" class="comp-title">Bi-Encoder Retriever</text>
    <text x="20" y="52" class="comp-sub">Embeds chunks and retrieves top-3 premise spans</text>
    <rect x="20" y="65" width="180" height="20" class="comp-pill-bg" />
    <text x="30" y="79" class="comp-pill-text">all-MiniLM-L6-v2 Cosine</text>
  </g>

  <!-- Card 3.3 -->
  <g transform="translate(940, 550)">
    <rect width="380" height="95" class="comp-card" />
    <text x="20" y="30" class="comp-title">Cross-Encoder NLI Verifier</text>
    <text x="20" y="52" class="comp-sub">Cross-attention: Entailment vs Contradiction</text>
    <rect x="20" y="65" width="180" height="20" class="comp-pill-bg" />
    <text x="30" y="79" class="comp-pill-text">DeBERTa-v3-small (143M)</text>
  </g>


  <!-- ==================== TIER 4: PERSISTENCE & OBSERVABILITY ==================== -->
  <rect x="50" y="705" width="1300" height="155" class="tier-container" />
  <rect x="50" y="705" width="1300" height="34" class="tier-header-bar" />
  <text x="75" y="727" class="tier-title">Tier 4: Audit Persistence &amp; Observability</text>
  <text x="1325" y="727" class="tier-badge">SQLite WAL • Real-Time Telemetry</text>

  <!-- Card 4.1 -->
  <g transform="translate(80, 750)">
    <rect width="570" height="95" class="comp-card" />
    <text x="20" y="30" class="comp-title">SQLite Audit Store (TraceStore)</text>
    <text x="20" y="52" class="comp-sub">Zero-loss audit persistence for compliance and defense review</text>
    <rect x="20" y="65" width="280" height="20" class="comp-pill-bg" />
    <text x="30" y="79" class="comp-pill-text">PRAGMA journal_mode=WAL • Sub-ms Writes</text>
  </g>

  <!-- Card 4.2 -->
  <g transform="translate(750, 750)">
    <rect width="570" height="95" class="comp-card" />
    <text x="20" y="30" class="comp-title">Live Inspector Drawer</text>
    <text x="20" y="52" class="comp-sub">Real-time sidecar drawer surfacing NLI proofs and contradiction scores</text>
    <rect x="20" y="65" width="280" height="20" class="comp-pill-bg" />
    <text x="30" y="79" class="comp-pill-text">Interactive Telemetry • Auto-Mitigation</text>
  </g>


  <!-- ==================== FLOW CONNECTORS ==================== -->
  <!-- Tier 1 -> Tier 2 -->
  <path d="M 365 260 L 365 305" class="arrow" />
  <rect x="290" y="274" width="150" height="18" class="label-bg" />
  <text x="365" y="287" class="arrow-label">1. User Prompt &amp; Request</text>

  <path d="M 1035 260 L 1035 305" class="arrow" />
  <rect x="945" y="274" width="180" height="18" class="label-bg" />
  <text x="1035" y="287" class="arrow-label">2. Ingested Document Chunks</text>

  <!-- Tier 2 -> Tier 3 -->
  <path d="M 700 460 L 700 505" class="arrow" />
  <rect x="570" y="474" width="260" height="18" class="label-bg" />
  <text x="700" y="487" class="arrow-label">3. Candidate Prose &amp; Context for Verification</text>

  <!-- Tier 3 -> Tier 4 -->
  <path d="M 365 660 L 365 705" class="arrow" />
  <rect x="290" y="674" width="150" height="18" class="label-bg" />
  <text x="365" y="687" class="arrow-label">4a. Commit Audit Trace</text>

  <path d="M 1035 660 L 1035 705" class="arrow" />
  <rect x="945" y="674" width="180" height="18" class="label-bg" />
  <text x="1035" y="687" class="arrow-label">4b. Stream Real-Time Proofs</text>

</svg>
