

services:
  gateway:
    build: .
    container_name: hearsay-gateway
    command: uvicorn hearsay.proxy.gateway:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./hearsay_traces.db:/app/hearsay_traces.db
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  dashboard:
    build: .
    container_name: hearsay-dashboard
    command: streamlit run hearsay/ui/dashboard.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./hearsay_traces.db:/app/hearsay_traces.db
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_HEADLESS=true
    restart: unless-stopped
