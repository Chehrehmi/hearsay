<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" width="1440" height="960">
  <defs>
    <style>
      .bg { fill: #FFFFFF; }
      .header-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #111827; letter-spacing: -0.3px; }
      .header-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 400; fill: #4B5563; }
      .header-rule { stroke: #E5E7EB; stroke-width: 1.5; }

      .entity-rect { fill: #FFFFFF; stroke: #111827; stroke-width: 1.6; rx: 4; }
      .entity-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13.5px; font-weight: 700; fill: #111827; text-anchor: middle; }
      .entity-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 400; fill: #4B5563; text-anchor: middle; }
      .entity-tag { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 10px; font-weight: 600; fill: #1E3A5F; text-anchor: middle; }
      
      .proc-box { fill: #FAFAFA; stroke: #111827; stroke-width: 1.8; rx: 12; }
      .proc-num { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; font-weight: 700; fill: #1E3A5F; text-anchor: middle; }
      .proc-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13.5px; font-weight: 700; fill: #111827; text-anchor: middle; }
      .proc-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; font-weight: 400; fill: #4B5563; text-anchor: middle; }
      .proc-tag { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 10px; font-weight: 600; fill: #0284C7; text-anchor: middle; }
      
      .subproc-box { fill: #FFFFFF; stroke: #94A3B8; stroke-width: 1; rx: 6; }

      .dstore-line { stroke: #111827; stroke-width: 1.8; }
      .dstore-title { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; font-weight: 700; fill: #111827; }
      .dstore-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; fill: #4B5563; }

      .flow { fill: none; stroke: #111827; stroke-width: 1.4; marker-end: url(#arrow-black); }
      .flow-lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; font-weight: 600; fill: #111827; text-anchor: middle; }
      .flow-sub { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 9.5px; fill: #4B5563; text-anchor: middle; }
    </style>

    <marker id="arrow-black" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#111827" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1440" height="960" class="bg" />

  <!-- Clean Academic Header -->
  <text x="50" y="42" class="header-title">Data Flow Diagram (DFD) — Level 1: Functional Decomposition</text>
  <text x="50" y="66" class="header-subtitle">Detailed Process Flow: Request Ingestion, Claim Decomposition, NLI Verification, Evasion Benchmarking &amp; Telemetry</text>
  <line x1="50" y1="84" x2="1390" y2="84" class="header-rule" />

  <!-- ==================== TOP ROW: INGESTION & DECOMPOSITION ==================== -->

  <!-- External Entity: Client App (Top Left) -->
  <rect x="70" y="130" width="170" height="95" class="entity-rect" />
  <text x="155" y="165" class="entity-title">Client Application</text>
  <text x="155" y="185" class="entity-sub">RAG Query / User Chat</text>
  <text x="155" y="205" class="entity-tag">HTTP / REST Client</text>

  <!-- Process 1.0: Ingestion & Parser -->
  <rect x="290" y="125" width="220" height="105" class="proc-box" />
  <text x="400" y="148" class="proc-num">1.0</text>
  <text x="400" y="168" class="proc-title">Request Ingestion &amp;</text>
  <text x="400" y="186" class="proc-title">Protocol Parsing</text>
  <text x="400" y="206" class="proc-desc">Extract Context &amp; Headers</text>
  <text x="400" y="220" class="proc-tag">ContextPayload / Starlette</text>

  <!-- Process 2.0: Claim Decomposer -->
  <rect x="570" y="125" width="220" height="105" class="proc-box" />
  <text x="680" y="148" class="proc-num">2.0</text>
  <text x="680" y="168" class="proc-title">Claim Decomposition &amp;</text>
  <text x="680" y="186" class="proc-title">Citation Extraction</text>
  <text x="680" y="206" class="proc-desc">Sentence Segmentation</text>
  <text x="680" y="220" class="proc-tag">spaCy en_core_web_sm</text>

  <!-- Process 3.0: Span Alignment & Retrieval -->
  <rect x="850" y="125" width="220" height="105" class="proc-box" />
  <text x="960" y="148" class="proc-num">3.0</text>
  <text x="960" y="168" class="proc-title">Bi-Encoder Semantic</text>
  <text x="960" y="186" class="proc-title">Span Alignment</text>
  <text x="960" y="206" class="proc-desc">Cosine Similarity Top-k</text>
  <text x="960" y="220" class="proc-tag">all-MiniLM-L6-v2</text>

  <!-- External Entity: Upstream LLM (Top Right) -->
  <rect x="1170" y="130" width="180" height="95" class="entity-rect" />
  <text x="1260" y="165" class="entity-title">Upstream LLM</text>
  <text x="1260" y="185" class="entity-sub">Gemini API / Local vLLM</text>
  <text x="1260" y="205" class="entity-tag">Foundation Model</text>

  <!-- ==================== MIDDLE ROW: VERIFICATION & ADVERSARIAL ==================== -->

  <!-- Process 5.0: Adversarial Perturbation Benchmarking (Mid-Left) -->
  <rect x="120" y="380" width="260" height="125" class="proc-box" />
  <text x="250" y="407" class="proc-num">5.0</text>
  <text x="250" y="427" class="proc-title">Adversarial Robustness</text>
  <text x="250" y="445" class="proc-title">&amp; Evasion Engine</text>
  <text x="250" y="465" class="proc-desc">Synonym • Hedging • Inversion</text>
  <text x="250" y="483" class="proc-tag">TextAttack / WordNet</text>

  <!-- Process 4.0: Dual-Path NLI Verifier (Center) -->
  <rect x="520" y="365" width="340" height="155" class="proc-box" />
  <text x="690" y="392" class="proc-num">4.0</text>
  <text x="690" y="412" class="proc-title">Dual-Path NLI Verification</text>
  <text x="690" y="430" class="proc-title">&amp; Margin Calibration</text>
  
  <rect x="540" y="445" width="140" height="50" class="subproc-box" />
  <text x="610" y="466" class="proc-desc" fill="#111827" font-weight="600">Path A: ALCE</text>
  <text x="610" y="482" class="proc-desc">Citation Binding</text>

  <rect x="700" y="445" width="140" height="50" class="subproc-box" />
  <text x="770" y="466" class="proc-desc" fill="#111827" font-weight="600">Path B: RAGTruth</text>
  <text x="770" y="482" class="proc-desc">Groundedness</text>

  <!-- D2: Local Model Cache (Mid-Right) -->
  <line x1="1000" y1="395" x2="1220" y2="395" class="dstore-line" />
  <line x1="1000" y1="475" x2="1220" y2="475" class="dstore-line" />
  <line x1="1025" y1="395" x2="1025" y2="475" stroke="#E5E7EB" stroke-width="1.5" />
  <text x="1012" y="439" font-family="SF Mono, monospace" font-size="11" font-weight="700" fill="#1E3A5F">D2</text>
  <text x="1038" y="423" class="dstore-title">Local Model Cache</text>
  <text x="1038" y="443" class="dstore-sub">nli-deberta-v3-small</text>
  <text x="1038" y="460" class="dstore-sub">HF_HUB_OFFLINE=1</text>

  <!-- ==================== BOTTOM ROW: STORES, TELEMETRY & AUDIT ==================== -->

  <!-- D3: Benchmark Gold Sets (Bottom-Left) -->
  <line x1="120" y1="645" x2="360" y2="645" class="dstore-line" />
  <line x1="120" y1="725" x2="360" y2="725" class="dstore-line" />
  <line x1="145" y1="645" x2="145" y2="725" stroke="#E5E7EB" stroke-width="1.5" />
  <text x="132" y="689" font-family="SF Mono, monospace" font-size="11" font-weight="700" fill="#1E3A5F">D3</text>
  <text x="158" y="673" class="dstore-title">Benchmark Gold Sets</text>
  <text x="158" y="693" class="dstore-sub">RAGTruth (ACL 2024)</text>
  <text x="158" y="710" class="dstore-sub">ALCE ASQA (EMNLP 2023)</text>

  <!-- Process 6.0: Telemetry, Observability & Traces (Bottom-Center) -->
  <rect x="520" y="630" width="340" height="120" class="proc-box" />
  <text x="690" y="658" class="proc-num">6.0</text>
  <text x="690" y="678" class="proc-title">Audit Logging, Telemetry</text>
  <text x="690" y="696" class="proc-title">&amp; React Observability</text>
  <text x="690" y="716" class="proc-desc">Span Attribution &amp; Diagnostics</text>
  <text x="690" y="732" class="proc-tag">React 18 SPA • SQLite Traces</text>

  <!-- D1: SQLite Audit Store (Bottom-Right) -->
  <line x1="1000" y1="645" x2="1220" y2="645" class="dstore-line" />
  <line x1="1000" y1="725" x2="1220" y2="725" class="dstore-line" />
  <line x1="1025" y1="645" x2="1025" y2="725" stroke="#E5E7EB" stroke-width="1.5" />
  <text x="1012" y="689" font-family="SF Mono, monospace" font-size="11" font-weight="700" fill="#1E3A5F">D1</text>
  <text x="1038" y="673" class="dstore-title">SQLite Audit Store</text>
  <text x="1038" y="693" class="dstore-sub">hearsay_traces.db</text>
  <text x="1038" y="710" class="dstore-sub">WAL Mode • Indexed Spans</text>

  <!-- External Entity: Security / QA Panel (Far Bottom Right) -->
  <rect x="1170" y="810" width="180" height="85" class="entity-rect" />
  <text x="1260" y="842" class="entity-title">Evaluation &amp; QA Panel</text>
  <text x="1260" y="862" class="entity-sub">Security &amp; Robustness</text>
  <text x="1260" y="880" class="entity-tag">Audit &amp; Benchmarks</text>

  <!-- ==================== CLEAN ORTHOGONAL FLOWS (ZERO CROSSINGS) ==================== -->

  <!-- Flow 1: Client -> 1.0 (POST req) -->
  <path d="M 240 175 L 290 175" class="flow" />
  <text x="265" y="165" class="flow-lbl">POST req</text>

  <!-- Flow 2: 1.0 -> Upstream LLM (Runs safely ABOVE top row at y=100) -->
  <path d="M 400 125 L 400 100 L 1260 100 L 1260 130" class="flow" />
  <text x="830" y="93" class="flow-lbl">Prompt + Context Payload</text>

  <!-- Flow 3: Upstream LLM -> 1.0 (Runs safely BELOW top row at y=250) -->
  <path d="M 1200 225 L 1200 250 L 460 250 L 460 230" class="flow" />
  <text x="830" y="244" class="flow-lbl">Raw Generated Prose</text>

  <!-- Flow 4: 1.0 -> 2.0 (Response Text) -->
  <path d="M 510 175 L 570 175" class="flow" />
  <text x="540" y="167" class="flow-lbl">Response Text</text>

  <!-- Flow 5: 2.0 -> 3.0 (Claims + Chunks) -->
  <path d="M 790 175 L 850 175" class="flow" />
  <text x="820" y="167" class="flow-lbl">Claims + Chunks</text>

  <!-- Flow 6: 3.0 -> 4.0 (Top-k Candidate Spans) -->
  <path d="M 960 230 L 960 305 L 750 305 L 750 365" class="flow" />
  <text x="860" y="298" class="flow-lbl">Top-k Evidence Spans (Premise, Hypothesis)</text>

  <!-- Flow 7: D2 Cache -> 4.0 (Pre-loaded Weights) -->
  <path d="M 1000 435 L 860 435" class="flow" />
  <text x="930" y="425" class="flow-sub">Cross-Encoder</text>

  <!-- Flow 11: 5.0 -> 4.0 (Perturbed Variants for Evasion Testing) -->
  <path d="M 380 435 L 520 435" class="flow" />
  <text x="450" y="422" class="flow-lbl">Perturbed Sentences</text>
  <text x="450" y="448" class="flow-sub">Measure Evasion Rate</text>

  <!-- Flow 10: D3 Corpora -> 5.0 (Clean straight vertical upward flow) -->
  <path d="M 250 645 L 250 505" class="flow" />
  <text x="240" y="580" class="flow-lbl" text-anchor="end">50 RAGTruth Samples</text>

  <!-- Flow 8: 4.0 -> 6.0 (Clean straight vertical downward flow) -->
  <path d="M 690 520 L 690 630" class="flow" />
  <text x="702" y="565" class="flow-lbl" text-anchor="start">Verification Results &amp; Attributions</text>
  <text x="702" y="582" class="flow-sub" text-anchor="start">Supported / Contradiction / Ungrounded</text>

  <!-- Flow 12: 5.0 -> 6.0 (Adversarial Matrix Results, routes cleanly between D3 and 6.0) -->
  <path d="M 350 505 L 350 580 L 520 580 L 520 645" class="flow" />
  <text x="435" y="573" class="flow-sub">Adversarial Evaluation Matrix (90% Base / 98% Hedging / 100% Defended)</text>

  <!-- Flow 9: 6.0 -> D1 (Insert Audit Record horizontally) -->
  <path d="M 860 685 L 1000 685" class="flow" />
  <text x="930" y="675" class="flow-lbl">Write Audit Trace</text>

  <!-- Flow 13: 6.0 -> Security Panel (Routes down to y=850, well below D1!) -->
  <path d="M 780 750 L 780 850 L 1170 850" class="flow" />
  <text x="960" y="842" class="flow-lbl">Live Telemetry &amp; Evasion Reports</text>

  <!-- Flow 14: 6.0 -> Client (Routes down to y=850, left along perimeter, well outside D3!) -->
  <path d="M 600 750 L 600 850 L 40 850 L 40 175 L 70 175" class="flow" />
  <text x="50" y="540" class="flow-lbl" text-anchor="start">Verified Payload + X-Hearsay-Status</text>
  <text x="50" y="558" class="flow-sub" text-anchor="start">Clamped Score: 0.0% – 100.0%</text>
</svg>